name: falling_eggs
description: "ChickRush is a fun and casual tapping game where eggs fall from the sky and you have to catch them before they hit the ground! Tap the eggs to collect points, unlock new levels and cute chicks, and challenge your reflexes. Save your progress, customize your profile, and compete on the leaderboard!"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

